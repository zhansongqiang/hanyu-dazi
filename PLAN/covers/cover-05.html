<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1660px; overflow:hidden; }
  body {
    background: radial-gradient(circle at 32% 12%, #FCF9F4 0%, #F6F2EA 52%, #EDE6D8 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #2B2B2B;
    display: flex; flex-direction: column;
    padding: 96px 84px 0;
  }
  .eyebrow {
    font-size: 34px; letter-spacing: 10px; color: #AE332E;
    font-weight: 700; margin-bottom: 46px;
  }
  h1 { font-size: 140px; line-height: 1.2; font-weight: 900; letter-spacing: 3px; }
  h1 .red { color: #AE332E; }
  .rule { width: 118px; height: 8px; background: #AE332E; margin: 50px 0 40px; }
  .sub { font-size: 46px; line-height: 1.62; color: #6B625A; letter-spacing: 2px; }
  .shotwrap {
    margin-top: auto; display: flex; justify-content: center;
    align-items: flex-start; overflow: hidden;
  }
  .shotwrap img {
    width: 580px; border-radius: 44px 44px 0 0;
    box-shadow: 0 -8px 70px rgba(60,40,20,.22);
  }
</style>
</head>
<body>
  <div class="eyebrow">汉语搭子 · 笔画描红</div>
  <h1>会认<br><span class="red">不会写</span></h1>
  <div class="rule"></div>
  <div class="sub">米字格描红 · 28 个常用字<br>先看一遍笔顺，再自己动手写</div>
  <div class="shotwrap">
    <img src="file:///D:/coding/hanyu-dazi/docs/shots/04-stroke.png" alt="">
  </div>
</body>
</html>
