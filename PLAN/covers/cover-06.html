<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1660px; overflow:hidden; }
  body {
    position: relative;
    background: radial-gradient(circle at 26% 16%, #FCF9F4 0%, #F6F2EA 54%, #EDE6D8 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #2B2B2B;
    display: flex; flex-direction: column;
    padding: 104px 84px 0;
  }
  .eyebrow {
    font-size: 34px; letter-spacing: 10px; color: #AE332E;
    font-weight: 700; margin-bottom: 50px;
  }
  h1 { font-size: 152px; line-height: 1.2; font-weight: 900; letter-spacing: 3px; }
  h1 .red { color: #AE332E; }
  .rule { width: 118px; height: 8px; background: #AE332E; margin: 52px 0 42px; }
  .sub { font-size: 46px; line-height: 1.62; color: #6B625A; letter-spacing: 2px; }
  /* 右下角小截图：斜贴一张，出血出画布 */
  .shot {
    position: absolute; right: -70px; bottom: -40px;
    width: 400px; border-radius: 34px;
    transform: rotate(-5deg);
    box-shadow: 0 20px 70px rgba(60,40,20,.30);
  }
</style>
</head>
<body>
  <div class="eyebrow">汉语搭子 · 断签不是失败</div>
  <h1>断签了？<br><span class="red">不清零。</span></h1>
  <div class="rule"></div>
  <div class="sub">段位只升不降 · 答错也给经验<br>不惩罚，才练得下去</div>
  <img class="shot" src="file:///D:/coding/hanyu-dazi/docs/shots/06-summary.png" alt="">
</body>
</html>
