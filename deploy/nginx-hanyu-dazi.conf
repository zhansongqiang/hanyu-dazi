# 汉语搭子 hanyu.zj17z.cn —— 第三个子域名，与主站 zj17z.cn / 演示站 demo.zj17z.cn
# 共用同一台服务器与同一个 nginx，但前端产物、后端进程、数据库、uploads 全部独立。
#
# 这份配置刻意保持最小：只有一个 80 端口块。443 块与 80→443 跳转由
# `sudo certbot --nginx -d hanyu.zj17z.cn` 自己写进来（它认得出这个 server_name）。
# 不预先手写 443，是为了避免证书路径写错后 nginx -t 直接失败。
#
# 后端只监听 127.0.0.1:8091，公网一律经这里的 443 进来 —— 8091 不开到公网，
# 也就绕不过证书与限流。

server {
    listen 80;
    listen [::]:80;
    server_name hanyu.zj17z.cn;

    charset utf-8;
    # 与同机其他站点一致：留足上传余量（录音单条上限 2MB，这里给的是全局余量）
    client_max_body_size 64m;

    root /home/ubuntu/hanyu-dazi/web/dist;
    index index.html;

    # ── 后端（独立进程，端口 8091；主站 8080、演示站 8082）──
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 跟读录音（争取项）走这个前缀，落在后端自己的 uploads/
    location /uploads/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 预生成音频（edge-tts）走这个前缀，后端以静态目录挂在 /audio 下
    location /audio/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 首页不缓存：否则改了前端、用户拿到旧 index.html 会去请求已经不存在的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri /index.html;
    }

    # 带 hash 的资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
